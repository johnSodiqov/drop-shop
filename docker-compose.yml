services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: dropstore
      POSTGRES_USER: dropstore
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-dropstore-dev-only}
    ports:
      - "5432:5432"
    volumes:
      - dropstore-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dropstore -d dropstore"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  dropstore-postgres:
